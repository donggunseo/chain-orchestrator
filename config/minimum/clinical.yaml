decisions:
  H1:
    question: 급성 뇌졸중 의심(S1). 응급 Stroke CT를 진행하시겠습니까?
    options:
      PROCEED_TO_CT:
        effect: commit
      NOT_STROKE_PATHWAY:
        effect: commit
      DEFER:
        effect: defer
        resume_timer: H1_DEFER
    evidence_context: hitl1_evidence
    requirement_ref: H1_ROLE
    origin_refs:
    - legacy-flow
  H2:
    question: 현재 제시된 tPA/TNK 근거묶음을 확인하고 IV thrombolysis 시행 여부를 결정해 주십시오.
    options:
      THROMBOLYSIS_YES:
        effect: commit
      THROMBOLYSIS_NO:
        effect: commit
      HOLD:
        effect: defer
        resume_timer: H2_DEFER
    evidence_context: hitl2_evidence
    requirement_ref: H2_ROLE
    origin_refs:
    - legacy-flow
timers:
  H1_OVERDUE:
    owner:
      kind: state
      id: S1
    anchor: state_entered
    after:
      value: 20
      unit: min
    on_expire:
      kind: task
      id: notice_h1_overdue
    cancel_when:
      any:
      - eq:
        - ref: decisions.H1.value
        - literal: PROCEED_TO_CT
      - eq:
        - ref: decisions.H1.value
        - literal: NOT_STROKE_PATHWAY
    reset_on: new_owner_generation
    repeat:
      max_firings: 1
    origin_refs:
    - legacy-flow
  CT_OVERDUE:
    owner:
      kind: state
      id: S2
    anchor: state_entered
    after:
      value: 30
      unit: min
    on_expire:
      kind: task
      id: notice_ct_overdue
    cancel_when: *id002
    reset_on: new_owner_generation
    repeat:
      max_firings: 1
    origin_refs:
    - legacy-flow
  H2_OVERDUE:
    owner:
      kind: state
      id: S2_1
    anchor: state_entered
    after:
      value: 10
      unit: min
    on_expire:
      kind: task
      id: notice_h2_overdue
    cancel_when:
      any:
      - eq:
        - ref: decisions.H2.value
        - literal: THROMBOLYSIS_YES
      - eq:
        - ref: decisions.H2.value
        - literal: THROMBOLYSIS_NO
    reset_on: new_owner_generation
    repeat:
      max_firings: 1
    origin_refs:
    - legacy-flow
  H1_DEFER:
    owner:
      kind: decision
      id: H1
    anchor: decision_deferred
    after:
      value: 10
      unit: min
    on_expire:
      kind: resume_decision
      id: H1
    cancel_when:
      not:
        eq:
        - ref: decisions.H1.value
        - literal: DEFER
    reset_on: new_owner_generation
    repeat:
      max_firings: 1
    origin_refs:
    - legacy-flow
  H2_DEFER:
    owner:
      kind: decision
      id: H2
    anchor: decision_deferred
    after:
      value: 10
      unit: min
    on_expire:
      kind: resume_decision
      id: H2
    cancel_when:
      not:
        eq:
        - ref: decisions.H2.value
        - literal: HOLD
    reset_on: new_owner_generation
    repeat:
      max_firings: 1
    origin_refs:
    - legacy-flow
lifecycle:
  initial: ACTIVE
  states:
  - ACTIVE
  - COMPLETED
  projection:
    fallback: ACTIVE
    rules:
      finish_minimum:
        state: COMPLETED
        priority: 10
        when:
          any:
          - *id006
          - eq:
            - ref: decisions.H1.value
            - literal: NOT_STROKE_PATHWAY
          - eq:
            - ref: decisions.H2.value
            - literal: THROMBOLYSIS_YES
          - eq:
            - ref: decisions.H2.value
            - literal: THROMBOLYSIS_NO
        requirement_refs: []
        origin_refs:
        - legacy-flow
  completion:
    state: COMPLETED
    wait_for: owned_work
    after_completion: reject
  origin_refs:
  - legacy-flow
